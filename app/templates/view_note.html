{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card
                    bg-secondary
                    text-light
                    shadow-lg
                    border-0">

            <div class="card-body p-4">

                <div class="d-flex
                            justify-content-between
                            align-items-center
                            mb-3">

                    <h2>

                        {{ note.title }}

                    </h2>

                    <small class="text-warning">

                        {{ note.created_at.strftime(
                            '%d %b %Y'
                        ) }}

                    </small>

                </div>

                <hr>

                <p style="white-space: pre-wrap;
                          line-height: 1.8;">

                    {{ note.content }}

                </p>

                <hr>

                <div class="d-flex gap-2">

                    <a href="{{ url_for(
                        'auth.edit_note',
                        note_id=note.id
                    ) }}"
                       class="btn btn-warning">

                       Edit

                    </a>

                    <a href="{{ url_for(
                        'auth.delete_note',
                        note_id=note.id
                    ) }}"
                       class="btn btn-danger"

                       onclick="
                       return confirm(
                       'Delete this note?'
                       )">

                       Delete

                    </a>

                    <a href="{{ url_for(
                        'auth.dashboard'
                    ) }}"
                       class="btn btn-dark">

                       Back

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
